name: NLLB model verification (manual, no APK)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-models:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install model metadata inspector
        run: python -m pip install --disable-pip-version-check 'onnx==1.17.0'
      - name: Download, checksum and inspect official RTranslator ONNX graphs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nllb-models reports
          python - <<'PY'
          import hashlib, json, pathlib, urllib.request
          import onnx
          base = "https://github.com/niedev/RTranslator/releases/download/2.0.0/"
          expected = {
              "NLLB_cache_initializer.onnx": 25368443,
              "NLLB_decoder.onnx": 179109694,
              "NLLB_embed_and_lm_head.onnx": 524712277,
              "NLLB_encoder.onnx": 266487014,
          }
          report = {"source": base, "graphs": {}}
          for name, size in expected.items():
              destination = pathlib.Path("nllb-models") / name
              request = urllib.request.Request(base + name, headers={"User-Agent": "NLLB-Model-Validation/1.0"})
              digest = hashlib.sha256()
              total = 0
              with urllib.request.urlopen(request, timeout=90) as response, destination.open("wb") as output:
                  while True:
                      block = response.read(1024 * 1024)
                      if not block: break
                      total += len(block)
                      if total > size: raise ValueError(f"{name}: unexpected download size")
                      digest.update(block)
                      output.write(block)
              if total != size: raise ValueError(f"{name}: expected {size}, got {total}")
              model = onnx.load(str(destination), load_external_data=False)
              onnx.checker.check_model(str(destination), full_check=False)
              def tensors(values):
                  return [{"name": v.name, "type": onnx.helper.printable_type(v.type)} for v in values]
              report["graphs"][name] = {
                  "bytes": total, "sha256": digest.hexdigest(),
                  "inputs": tensors(model.graph.input), "outputs": tensors(model.graph.output),
                  "opset": [{"domain": x.domain, "version": x.version} for x in model.opset_import]
              }
              print(name, total, digest.hexdigest(), flush=True)
              destination.unlink()
          pathlib.Path("reports/nllb-graph-signatures.json").write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
      - name: Upload graph checksums and signatures (no model binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nllb-graph-validation-report
          path: reports/
          if-no-files-found: warn
          retention-days: 14
