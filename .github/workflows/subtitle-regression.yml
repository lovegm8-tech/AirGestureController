name: Subtitle regression replay
on:
  push:
    branches:
      - feature/subtitle-regression-harness
    paths:
      - 'tools/subtitle_regression/**'
      - '.github/workflows/subtitle-regression.yml'
  pull_request:
    paths:
      - 'tools/subtitle_regression/**'
      - '.github/workflows/subtitle-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check fixture schema and replay regression gates
        run: python3 tools/subtitle_regression/replay.py tools/subtitle_regression/fixtures/*.json
      - name: Verify regression gate rejects deliberately degraded trace
        run: |
          if python3 tools/subtitle_regression/compare.py tools/subtitle_regression/fixtures/baseline_sample.json tools/subtitle_regression/fixtures/regression_sample.json; then
            echo "Regression gate unexpectedly accepted a degraded trace" >&2
            exit 1
          fi
      - name: Verify identical baseline passes
        run: python3 tools/subtitle_regression/compare.py tools/subtitle_regression/fixtures/baseline_sample.json tools/subtitle_regression/fixtures/baseline_sample.json
      - name: Verify diagnostic import can replay real app trace format
        run: |
          python3 tools/subtitle_regression/import_diagnostics.py tools/subtitle_regression/fixtures/diagnostic_sample.txt /tmp/subtitle-import.json
          python3 tools/subtitle_regression/replay.py /tmp/subtitle-import.json
