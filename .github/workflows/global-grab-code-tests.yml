name: Global Grab Code Tests Only (No APK)
on:
  push:
    branches:
      - experiment/global-grab-code
    paths:
      - transferbeta/app/src/**
      - transferbeta/app/build.gradle.kts
      - transferbeta/build.gradle.kts
      - transferbeta/settings.gradle.kts
      - .github/workflows/global-grab-code-tests.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: global-grab-code-tests
  cancel-in-progress: true
jobs:
  code-tests:
    if: github.ref == 'refs/heads/experiment/global-grab-code'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: transferbeta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK for unit-test compilation only
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35"
      - name: Kotlin + Java unit tests only; NO assemble, packaging, signing or APK
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
