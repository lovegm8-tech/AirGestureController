name: Android APK - permanently signed release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Stable signed APK for installation and updates"
        type: choice
        required: true
        default: signed-release
        options:
          - signed-release
          - debug

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Debug build (temporary signature)
        if: inputs.mode == 'debug'
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Signed release build
        if: inputs.mode == 'signed-release'
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.AIRGESTURE_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_BUNDLE_B64}" ]]; then
            echo "Missing required encrypted repository secret: AIRGESTURE_SIGNING_BUNDLE_B64" >&2
            exit 1
          fi
          umask 077
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess
          encoded = os.environ.pop('SIGNING_BUNDLE_B64')
          keyfile = pathlib.Path(os.environ['RUNNER_TEMP']) / 'airgesture-release.jks'
          try:
              bundle = json.loads(base64.b64decode(encoded, validate=True))
              assert bundle['key_alias'] == 'airgesture'
              keyfile.write_bytes(base64.b64decode(bundle['keystore_base64'], validate=True))
              build_env = os.environ.copy()
              build_env.update({
                  'AIRGESTURE_KEYSTORE_FILE': str(keyfile),
                  'AIRGESTURE_STORE_PASSWORD': bundle['store_password'],
                  'AIRGESTURE_KEY_ALIAS': bundle['key_alias'],
                  'AIRGESTURE_KEY_PASSWORD': bundle['key_password'],
              })
              subprocess.run(['gradle', ':app:testDebugUnitTest', ':app:assembleRelease', '--no-daemon'], env=build_env, check=True)
          finally:
              keyfile.unlink(missing_ok=True)
          PY
      - name: Verify permissions and certificate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.mode }}" == "signed-release" ]]; then
            APK="app/build/outputs/apk/release/app-release.apk"
          else
            APK="app/build/outputs/apk/debug/app-debug.apk"
          fi
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" > "$RUNNER_TEMP/permissions.txt"
          if grep -F 'android.permission.INTERNET' "$RUNNER_TEMP/permissions.txt"; then
            echo 'Unexpected INTERNET permission; refusing to release.' >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-certificate.txt"
          if [[ "${{ inputs.mode }}" == "signed-release" ]]; then
            if ! grep -qiF '05e77197d2ad73ac4a255e4c40b868a5c26c539b9aea3c1abd53100ff484f19e' "$RUNNER_TEMP/apk-certificate.txt"; then
              echo 'Wrong APK signing certificate; refusing to release.' >&2
              exit 1
            fi
          fi
          echo 'Security checks passed.'
      - name: Upload permanently signed APK
        if: inputs.mode == 'signed-release'
        uses: actions/upload-artifact@v4
        with:
          name: AirGesture-v0.2.0-permanent-signed
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
      - name: Upload debug APK (non-updatable)
        if: inputs.mode == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: AirGesture-debug-temp-signature
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
