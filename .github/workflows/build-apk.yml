name: Android APK - manual build only

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Debug tests (temporary signature), or signed release (stable signature from repository secrets)"
        type: choice
        required: true
        default: debug
        options:
          - debug
          - signed-release

permissions:
  contents: read

jobs:
  build:
    # This workflow is ONLY manually triggered. Never build unreviewed PR code with signing secrets.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Debug build and unit tests
        if: inputs.mode == 'debug'
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Validate presence of release signing secrets
        if: inputs.mode == 'signed-release'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.AIRGESTURE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AIRGESTURE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AIRGESTURE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AIRGESTURE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required release signing secret: $name" >&2
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/airgesture-release.jks"
          test -s "$RUNNER_TEMP/airgesture-release.jks"

      - name: Signed release build and unit tests
        if: inputs.mode == 'signed-release'
        env:
          AIRGESTURE_KEYSTORE_FILE: ${{ runner.temp }}/airgesture-release.jks
          AIRGESTURE_STORE_PASSWORD: ${{ secrets.AIRGESTURE_STORE_PASSWORD }}
          AIRGESTURE_KEY_ALIAS: ${{ secrets.AIRGESTURE_KEY_ALIAS }}
          AIRGESTURE_KEY_PASSWORD: ${{ secrets.AIRGESTURE_KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon

      - name: Safety gate - no runtime internet permission
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.mode }}" == "signed-release" ]]; then
            APK="app/build/outputs/apk/release/app-release.apk"
          else
            APK="app/build/outputs/apk/debug/app-debug.apk"
          fi
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" > "$RUNNER_TEMP/apk-permissions.txt"
          if grep -F 'android.permission.INTERNET' "$RUNNER_TEMP/apk-permissions.txt"; then
            echo 'SECURITY CHECK FAILED: APK unexpectedly requests internet access' >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          echo 'Security checks passed: no INTERNET permission, APK signature verifies.'

      - name: Upload debug APK (temporary signature, do not use for permanent updates)
        if: inputs.mode == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: AirGesture-debug-ephemeral
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload signed release APK (stable signature)
        if: inputs.mode == 'signed-release'
        uses: actions/upload-artifact@v4
        with:
          name: AirGesture-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Remove ephemeral copy of signing material
        if: always() && inputs.mode == 'signed-release'
        shell: bash
        run: rm -f "$RUNNER_TEMP/airgesture-release.jks"
