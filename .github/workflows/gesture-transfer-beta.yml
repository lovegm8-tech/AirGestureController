name: Gesture Transfer Beta APK
on:
  push:
    branches: [ "experiment/gesture-transfer-beta" ]
    paths:
      - "transferbeta/**"
      - ".github/workflows/gesture-transfer-beta.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/experiment/gesture-transfer-beta'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: transferbeta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build isolated beta and run unit tests
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Verify separate package
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n1 | grep -F tw.airgesture.transferbeta
      - uses: actions/upload-artifact@v4
        with:
          name: GestureTransferBeta-v0.1.1-debug-apk
          path: transferbeta/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
