name: iPhone NFC WiFi Code Tests (No APK)
on:
  push:
    branches:
      - feature/ios14-nfc-wifi-v1
    paths:
      - transferbeta/app/src/**
      - transferbeta/app/build.gradle.kts
      - .github/workflows/ios-bridge-code-tests.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-bridge-code-tests
  cancel-in-progress: true
jobs:
  code-tests:
    if: github.ref == 'refs/heads/feature/ios14-nfc-wifi-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: transferbeta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK for unit test compilation only
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35"
      - name: Compile Kotlin Java and run JVM tests, no APK
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
