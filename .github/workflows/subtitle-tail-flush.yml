name: Subtitle tail flush compile check
on:
  push:
    branches: [feature/subtitle-safe-tail-flush-v1-0-45]
    paths:
      - 'transferbeta/app/src/main/**'
      - '.github/workflows/subtitle-tail-flush.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: transferbeta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Download pinned sherpa-onnx AAR
        run: |
          mkdir -p app/libs
          curl --fail --location --retry 4 --connect-timeout 30 --max-time 240 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar" \
            --output app/libs/sherpa-onnx-1.13.8.aar
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  app/libs/sherpa-onnx-1.13.8.aar" | sha256sum -c -
      - name: Run unit tests and compile debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
