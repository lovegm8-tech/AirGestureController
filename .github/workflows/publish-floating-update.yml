name: Manually Publish AirGesture Update and Send FCM
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'test = S26 Ultra trial, stable = S25 production'
        required: true
        type: choice
        options: [test, stable]
      confirm:
        description: 'Type PUBLISH to explicitly authorize APK release and FCM push'
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/experiment/floating-control-integration' && github.event.inputs.confirm == 'PUBLISH' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
      FIREBASE_ANDROID_API_KEY: ${{ vars.FIREBASE_ANDROID_API_KEY }}
      FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      SIGNING_BUNDLE_B64: ${{ secrets.AIRGESTURE_SIGNING_BUNDLE_B64 }}
    defaults:
      run:
        working-directory: transferbeta
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Firebase client setup and signing exist
        run: |
          set -euo pipefail
          for name in FIREBASE_ANDROID_APP_ID FIREBASE_ANDROID_API_KEY FIREBASE_SENDER_ID FIREBASE_PROJECT_ID SIGNING_BUNDLE_B64; do
            test -n "${!name}" || { echo "Missing GitHub setting: $name" >&2; exit 1; }
          done
          VERSION=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION"
          if [[ "${{ inputs.channel }}" == "test" ]]; then
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]] ||
              { echo 'Test releases require versionName x.y.z-beta.N' >&2; exit 1; }
          else
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
              { echo 'Stable releases require versionName x.y.z' >&2; exit 1; }
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists. Never replace signed APK silently." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests and signed release assemble
        run: gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon
      - name: Sign APK with permanent release certificate
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,base64,json,pathlib,subprocess,re
          encoded = os.environ["SIGNING_BUNDLE_B64"].strip().lstrip("\ufeff")
          if encoded.startswith("AIRGESTURE_SIGNING_BUNDLE_B64="):
              encoded = encoded.split("=", 1)[1]
          encoded = "".join(encoded.strip().strip("'\"").split())
          candidates = [encoded] + re.findall(r"[A-Za-z0-9+/=]{2000,}", encoded)
          bundle = None
          for candidate in candidates:
              try:
                  decoded = json.loads(base64.b64decode(candidate, validate=True))
                  if isinstance(decoded, dict) and decoded.get("key_alias") == "airgesture":
                      bundle = decoded
                      break
              except (ValueError, KeyError, json.JSONDecodeError):
                  continue
          if bundle is None:
              raise SystemExit("Invalid signing secret")
          key = pathlib.Path(os.environ["RUNNER_TEMP"])/"signing.jks"
          unsigned = pathlib.Path("app/build/outputs/apk/release/app-release-unsigned.apk")
          signed = pathlib.Path("app/build/outputs/apk/release/app-release.apk")
          try:
              key.write_bytes(base64.b64decode(bundle["keystore_base64"],validate=True))
              env = os.environ.copy()
              env["STORE_PASSWORD"] = bundle["store_password"]
              env["KEY_PASSWORD"] = bundle["key_password"]
              subprocess.run([
                os.environ["ANDROID_HOME"]+"/build-tools/35.0.0/apksigner",
                "sign","--ks",str(key),"--ks-key-alias","airgesture",
                "--ks-pass","env:STORE_PASSWORD","--key-pass","env:KEY_PASSWORD",
                "--out",str(signed),str(unsigned)],env=env,check=True)
          finally:
              key.unlink(missing_ok=True)
          PY
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/cert.txt"
          grep -qiF '05e77197d2ad73ac4a255e4c40b868a5c26c539b9aea3c1abd53100ff484f19e' "$RUNNER_TEMP/cert.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 1 | grep -F "versionName='$VERSION'"
      - name: Authenticate to Firebase Cloud Messaging
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging
      - name: Create immutable GitHub Release (only after manual confirmation)
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          if [[ "${{ inputs.channel }}" == "test" ]]; then
            gh release create "v$VERSION" "$APK" --prerelease --title "AirGesture v$VERSION (test)" --notes "Signed opt-in beta update for test devices."
          else
            gh release create "v$VERSION" "$APK" --title "AirGesture v$VERSION" --notes "Signed stable update for opted-in devices."
          fi
      - name: Push FCM update-check hint (test and stable isolated)
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          export CHANNEL="${{ inputs.channel }}"
          TOPIC="airgesture-$CHANNEL"
          python3 - <<'PY'
          import json,os
          topic="airgesture-"+os.environ["CHANNEL"]
          data={"message":{"topic":topic,"data":{
              "action":"check_update","channel":topic
          },"android":{"priority":"high","ttl":"3600s"}}}
          with open(os.environ["RUNNER_TEMP"]+"/fcm-message.json","w") as f:
              json.dump(data,f)
          PY
          curl --fail --silent --show-error --max-time 30 -X POST \
            -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json; charset=UTF-8' \
            --data-binary @"$RUNNER_TEMP/fcm-message.json" \
            "https://fcm.googleapis.com/v1/projects/$FIREBASE_PROJECT_ID/messages:send"
